<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>

    <title>UNIPIA - App for UCL Students</title>

    <noscript>
        <xml>
            <o:OfficeDocumentSettings>

    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            background-color: #ffffff;
        }
        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            border: 0;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
            display: block;
        }
        a {
            text-decoration: none;
        }
        
        /* Responsive styles */
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                max-width: 100% !important;
            }
            .responsive-img {
                width: 100% !important;
                height: auto !important;
            }
            .mobile-padding {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }
            .store-btn {
                width: 140px !important;
                height: auto !important;
            }
            .feature-img {
                width: 100% !important;
                max-width: 320px !important;
                height: auto !important;
            }
            .header-logo {
                width: 120px !important;
                height: auto !important;
            }
            .header-badge {
                width: 100px !important;
                height: auto !important;
            }

<body style="margin: 0; padding: 0; background-color: #ffffff;">

                                    <td align="left" valign="middle" style="width: 50%;">

                                    </td>
                                    <td align="right" valign="middle" style="width: 50%;">

                    </tr>

                                    </td>

                                </tr>

                    </tr>
                    
                    <!-- 6) Feature Section 3 - Purple Border 8px with Padding -->
                    <tr>
                        <td style="padding: 24px 16px; border-left: 8px solid #6758F1; border-right: 8px solid #6758F1; background-color: #ffffff;">

                    </tr>

                    <tr>
                        <td style="padding: 0; border-left: 8px solid #6758F1; border-right: 8px solid #6758F1;">

                    </tr>

                    <tr>
                        <td align="center" style="padding: 16px 0; background-color: #6758F1; border-left: 8px solid #6758F1; border-right: 8px solid #6758F1;">

                            </a>
                        </td>
                    </tr>

                        <td style="padding: 0; border-left: 8px solid #6758F1; border-right: 8px solid #6758F1; border-bottom: 8px solid #6758F1;">

                            <div style="background-color: #F9FAFB;">
